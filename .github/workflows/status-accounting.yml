name: SCM Status Accounting

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:

  scm-status-accounting:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Generate SCM Report

        uses: actions/github-script@v7

        with:
          script: |

            const fs = require('fs');

            const pr = context.payload.pull_request;

            const report = {

              timestamp: new Date().toISOString(),

              prNumber: pr.number,

              title: pr.title,

              author: pr.user.login,

              merged: pr.merged,

              status: pr.merged
                ? "APPROVED_AND_MERGED"
                : "REJECTED",

              sourceBranch: pr.head.ref,

              targetBranch: pr.base.ref,

              mergeCommit: pr.merge_commit_sha,

              mergedBy: pr.merged_by
                ? pr.merged_by.login
                : null,

              mergedAt: pr.merged_at,

              closedAt: pr.closed_at,

              reviewers:
                pr.requested_reviewers
                  ? pr.requested_reviewers.map(r => r.login)
                  : [],

              url: pr.html_url

            };

            fs.writeFileSync(
              "scm-status-report.json",
              JSON.stringify(report,null,2)
            );

      - name: Upload SCM Report

        uses: actions/upload-artifact@v4

        with:

          name: scm-status-report-pr-${{ github.event.pull_request.number }}

          path: scm-status-report.json
